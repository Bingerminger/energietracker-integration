name: Validate

# hassfest checks the integration as Home Assistant does, the HACS action
# checks what HACS needs (hacs.json, brand images, repository description,
# topics, licence). Both also run daily, as HACS recommends: a new rule shows
# up without a commit. The tests need only the standard library.
#
# Actions are pinned to a commit; Dependabot proposes updates for tagged
# actions. hacs/action and home-assistant/actions have no release tags (HACS
# documents `@main`, Home Assistant `@master`): refresh those two pins by hand
# with the commit named in the comment. Both run a container image of their
# own (ghcr.io/hacs/action:main, ghcr.io/home-assistant/hassfest), which a pin
# of the action does not fix.
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "23 4 * * *"
  workflow_dispatch:

permissions: {}

jobs:
  hassfest:
    name: hassfest
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: hassfest
        uses: home-assistant/actions/hassfest@86d4564712fa02543c808e3a693dd04f9d3f8361 # master 2026-10-26

  hacs:
    name: HACS
    runs-on: ubuntu-latest
    steps:
      - name: HACS validation
        uses: hacs/action@1ebf01c408f29afcb6406bd431bc98fd8cbb15aa # main 2026-06-08
        with:
          category: integration

  tests:
    name: Tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"

      - name: Tests (standard library only)
        run: python -I -m unittest discover -s tests -v
